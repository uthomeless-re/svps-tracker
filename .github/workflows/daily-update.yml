name: Daily stats update

on:
  schedule:
    # 毎日 22:00 JST (=13:00 UTC) に実行
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # 手動実行用（Actionsタブから "Run workflow" で即実行できる）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape shadowverse-reference.com
        working-directory: scripts
        run: python scrape_reference.py
        continue-on-error: true  # 1サイト落ちても他の取得は続ける

      - name: Check if today is the monthly svlabo.jp day
        id: check_monthly
        run: |
          # svlabo.jp（ランクマッチ最高順位）は毎日変わるものではないので、
          # 毎月1日(JST)だけ取得する。それ以外の日はこのステップ以降のsvlabo取得をスキップする。
          DAY=$(TZ='Asia/Tokyo' date +%d)
          echo "today (JST) day-of-month = $DAY"
          if [ "$DAY" = "01" ]; then
            echo "run_svlabo=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_svlabo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape svlabo.jp (monthly)
        if: steps.check_monthly.outputs.run_svlabo == 'true'
        working-directory: scripts
        run: python scrape_svlabo.py
        continue-on-error: true

      - name: Scrape ps.shadowverse-wb.com
        working-directory: scripts
        run: python scrape_ps_results.py
        continue-on-error: true

      - name: Merge into history.csv
        working-directory: scripts
        run: python update_history.py

      - name: Commit and push data
        run: |
          git config user.name "svps-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: daily stats update $(date -u +%Y-%m-%d)"
          git push

      - name: Build Pages output (site/ + data/ をまとめる)
        run: |
          mkdir -p _site
          cp -r site/* _site/
          mkdir -p _site/data
          cp data/history.csv _site/data/history.csv
          cp data/players.csv _site/data/players.csv

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
