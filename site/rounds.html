<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>節別詳細結果 | Shadowverse Premier Series 26-27 選手データトラッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データトラッカー</a></h1>
  <nav>
    <a class="nav-btn" href="index.html">選手一覧</a>
    <a class="nav-btn" href="ranking.html">ランキング</a>
    <a class="nav-btn" href="matches.html">試合結果</a>
    <a class="nav-btn active" href="rounds.html">節別詳細</a>
    <a class="nav-btn" href="compare.html">比較</a>
  </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script src="common.js"></script>
<script>
// svlabo.jpの「N節 試合詳細結果＆配信時間指定URL」記事(例: https://svlabo.jp/blog-entry-1793.html)を
// 手動で取り込んだ data/battle_details.csv を表示する。取り込み方法・スキーマはREADME「節別詳細結果について」参照。
async function boot() {
  const app = document.getElementById("app");
  let battles;
  try {
    battles = await loadBattleDetails();
  } catch (err) {
    app.innerHTML = `<div class="error-banner">データ読み込みエラー: ${err.message}</div>`;
    return;
  }

  if (!battles.length) {
    app.innerHTML = `<div class="empty-note">まだ節別詳細結果のデータがありません</div>`;
    return;
  }

  const sections = [...new Set(battles.map(b => b.section))].sort((a, b) => a - b);

  app.innerHTML = `
    <div class="empty-note" style="padding-top:0;">svlabo.jpが公開している節ごとの試合詳細結果。使用したクラスは通常表示、
    登録していたが使わなかったクラスは薄く表示しています。「配信を見る」は該当バトル開始時点にジャンプします。</div>
    <div class="control-row">
      <div class="control-group">
        <label>節</label>
        <select id="sectionSelect">${sections.map(s => `<option value="${s}">${s}節</option>`).join("")}</select>
      </div>
    </div>
    <div id="roundsWrap"></div>
  `;

  const sel = document.getElementById("sectionSelect");
  sel.addEventListener("change", () => renderSection(battles, sel.value));
  renderSection(battles, sel.value);
}

function battleRowHTML(b) {
  const t1win = b.winlose === "WIN";
  return `
    <tr>
      <td>
        BATTLE${b.battle_no}
        <div style="font-size:10px;color:var(--text-muted);">${b.team1}側:${b.fise}</div>
      </td>
      <td>
        <div>${b.player1}</div>
        ${classPoolHTML(b.class1_pool, b.class1_used, 18)}
      </td>
      <td style="text-align:center;color:var(--text-muted);font-size:11px;">vs</td>
      <td>
        <div>${b.player2}</div>
        ${classPoolHTML(b.class2_pool, b.class2_used, 18)}
      </td>
      <td>
        <span class="result-badge ${t1win ? "win" : "lose"}">${b.team1} ${t1win ? "WIN" : "LOSE"}</span>
      </td>
      <td>${b.video_url ? `<a href="${b.video_url}" target="_blank" rel="noopener" style="font-size:12px;">配信を見る ↗</a>` : "-"}</td>
    </tr>`;
}

function renderSection(battles, section) {
  const rows = battles.filter(b => b.section === section);

  // half+round_noでグルーピングしつつ、元の並び順（前半戦R1→前半戦R2→後半戦R1→後半戦R2）を保つ
  const groups = {};
  const order = [];
  rows.forEach(b => {
    const key = b.half + "|" + b.round_no;
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(b);
  });

  const html = order.map(key => {
    const list = groups[key];
    const first = list[0];
    const body = list.map(battleRowHTML).join("");
    return `
      <div class="chart-box" style="margin-bottom:16px;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
          <span style="font-weight:700; font-size:13px; color:var(--text-muted);">${first.half} ROUND ${first.round_no}</span>
          <span style="flex:1;"></span>
          ${teamLogoHTML(first.team1, 26)}
          <span style="font-size:13px; font-weight:600;">${first.team1}</span>
          <span style="color:var(--text-muted); font-size:12px;">vs</span>
          ${teamLogoHTML(first.team2, 26)}
          <span style="font-size:13px; font-weight:600;">${first.team2}</span>
        </div>
        <table class="rank-table">
          <thead><tr><th>BATTLE</th><th>${first.team1}側</th><th></th><th>${first.team2}側</th><th>結果</th><th>配信</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>`;
  }).join("");

  document.getElementById("roundsWrap").innerHTML = html;
}

boot();
</script>
</body>
</html>
