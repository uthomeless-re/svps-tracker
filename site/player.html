<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選手詳細 | Shadowverse Premier Series 26-27 選手データトラッカー</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データトラッカー</a></h1>
  <nav>
    <a class="nav-btn" href="index.html">選手一覧</a>
    <a class="nav-btn" href="ranking.html">ランキング</a>
  </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script src="common.js"></script>
<script>
let chart = null;

function drawChart(history, name, metric, color) {
  const rows = history.filter(r => r.player_name === name && r.metric === metric).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const labels = rows.map(r => r.date);
  const data = rows.map(r => parseFloat(r.value));

  if (chart) chart.destroy();
  if (typeof Chart === "undefined") {
    document.querySelector(".chart-box").innerHTML = `<div class="empty-note">グラフライブラリの読み込みに失敗しました</div>`;
    return;
  }
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels, datasets: [{
      label: metricLabel(metric),
      data,
      borderColor: color,
      backgroundColor: color,
      spanGaps: true,
      tension: 0.25,
      pointRadius: 3,
    }] },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#6b7280" }, grid: { color: "#f0f1f3" } },
        y: { ticks: { color: "#6b7280" }, grid: { color: "#f0f1f3" }, reverse: isLowerBetter(metric) },
      },
    },
  });
}

async function boot() {
  const app = document.getElementById("app");
  const name = new URLSearchParams(location.search).get("name");

  let data;
  try {
    data = await loadData();
  } catch (err) {
    app.innerHTML = `<div class="error-banner">データ読み込みエラー: ${err.message}</div>`;
    return;
  }
  const { players, history, images } = data;

  const player = players.find(p => p.player_name === name);
  if (!player) {
    app.innerHTML = `<a class="back-link" href="index.html">← 選手一覧に戻る</a><div class="empty-note">選手が見つかりません</div>`;
    return;
  }

  const rows = history.filter(r => r.player_name === name);
  const metrics = [...new Set(rows.map(r => r.metric))];
  const preferredOrder = ["followers", "youtube_subscribers"];
  metrics.sort((a, b) => {
    const ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b);
  });

  const followers = latestValue(history, name, "followers");
  const yt = latestValue(history, name, "youtube_subscribers");
  const color = TEAM_COLORS[player.team_tag] || "#888";

  app.innerHTML = `
    <a class="back-link" href="index.html">← 選手一覧に戻る</a>
    <div class="detail-header">
      ${avatarHTML(player, images, 72)}
      <div class="info">
        <h2>${player.player_name}</h2>
        ${teamBadgeHTML(player.team_tag)}
        <span style="color:var(--text-muted); font-size:13px; margin-left:6px;">${player.team_name}</span>
      </div>
    </div>
    <div class="quick-stats">
      <div class="quick-stat"><div class="label">Xフォロワー数</div><div class="value">${followers != null ? fmtNum(followers) : "-"}</div></div>
      <div class="quick-stat"><div class="label">YouTube登録者数</div><div class="value">${yt != null ? fmtNum(yt) : "-"}</div></div>
    </div>
    ${metrics.length ? `
      <div class="control-row">
        <div class="control-group">
          <label>指標</label>
          <select id="metricSelect">${metrics.map(m => `<option value="${m}">${metricLabel(m)}</option>`).join("")}</select>
        </div>
      </div>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    ` : `<div class="empty-note">この選手のデータはまだありません</div>`}
  `;

  if (metrics.length) {
    const sel = document.getElementById("metricSelect");
    sel.addEventListener("change", () => drawChart(history, name, sel.value, color));
    drawChart(history, name, sel.value, color);
  }
}

boot();
</script>
</body>
</html>
