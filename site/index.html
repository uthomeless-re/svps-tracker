<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選手一覧 | Shadowverse Premier Series 26-27 選手データトラッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データトラッカー</a></h1>
  <nav>
    <a class="nav-btn active" href="index.html">選手一覧</a>
    <a class="nav-btn" href="ranking.html">ランキング</a>
    <a class="nav-btn" href="matches.html">試合結果</a>
  </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script src="common.js"></script>
<script>
function playerCardHTML(p, history, images) {
  const followers = latestValue(history, p.player_name, "followers");
  const yt = latestValue(history, p.player_name, "youtube_subscribers");
  return `
    <a class="player-card" href="player.html?name=${encodeURIComponent(p.player_name)}">
      <div class="photo-row">
        ${avatarHTML(p, images, 44)}
        <div>
          <div class="name">${p.player_name}</div>
          ${teamBadgeHTML(p.team_tag)}
        </div>
      </div>
      <div class="stats">
        <div>Xフォロワー: <b>${followers != null ? fmtNum(followers) : "-"}</b></div>
        <div>YouTube登録者: <b>${yt != null ? fmtNum(yt) : "-"}</b></div>
      </div>
    </a>`;
}

async function boot() {
  const app = document.getElementById("app");
  let data, matches;
  try {
    [data, matches] = await Promise.all([loadData(), loadMatches()]);
  } catch (err) {
    app.innerHTML = `<div class="error-banner">データ読み込みエラー: ${err.message}（まだ一度もデータ更新が走っていない可能性があります）</div>`;
    return;
  }

  const { players, history, images } = data;
  const standings = computeTeamStandings(players, matches);
  const hasMatches = matches.length > 0;

  const blocks = standings.map((team, i) => {
    const cards = team.players.map(p => playerCardHTML(p, history, images)).join("");
    const pointsLabel = hasMatches ? `${fmtNum(team.points)}pt（${team.wins}勝${team.losses}敗）` : "試合結果はまだありません";
    return `
      <details class="team-block" ${i === 0 && hasMatches ? "open" : ""}>
        <summary>
          <span class="team-rank">${hasMatches ? i + 1 : "-"}</span>
          ${teamBadgeHTML(team.team_tag)}
          <span class="team-title">${team.team_name}</span>
          <span class="team-points">${pointsLabel}</span>
          <span class="chevron">▼</span>
        </summary>
        <div class="team-panel">
          <div class="players-grid">${cards}</div>
        </div>
      </details>`;
  }).join("");

  app.innerHTML = blocks;
}

boot();
</script>
</body>
</html>
