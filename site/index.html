<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadowverse Premier Series 26-27 選手データトラッカー</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #1b1f27;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2f6fed;
    --accent-soft: #eaf1ff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 6px; }
  nav button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-muted);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 980px; margin: 0 auto; padding: 24px; }
  .error-banner {
    background: #fff4f4; border: 1px solid #f3b4b4; color: #a33; padding: 12px 14px;
    border-radius: 10px; font-size: 13px; margin-bottom: 16px;
  }
  .team-badge {
    display: inline-block; font-size: 11px; font-weight: 600; color: #fff;
    padding: 2px 8px; border-radius: 999px; letter-spacing: .02em;
  }
  .players-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px;
  }
  .player-card {
    border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer;
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    background: #fff;
  }
  .player-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); transform: translateY(-2px); border-color: #d8dee9; }
  .player-card .name { font-size: 15px; font-weight: 600; margin: 8px 0 4px; }
  .player-card .team-name { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .player-card .stats { font-size: 12px; color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  .player-card .stats b { color: var(--text); font-weight: 600; }

  .back-link { font-size: 13px; color: var(--accent); cursor: pointer; display: inline-block; margin-bottom: 14px; }
  .detail-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .detail-header h2 { font-size: 22px; margin: 0; }
  .quick-stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
  .quick-stat { border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; min-width: 140px; }
  .quick-stat .label { font-size: 11px; color: var(--text-muted); }
  .quick-stat .value { font-size: 20px; font-weight: 700; margin-top: 2px; }

  .control-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .control-group { display: flex; flex-direction: column; gap: 5px; }
  .control-group label { font-size: 12px; color: var(--text-muted); }
  select {
    background: #fff; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; min-width: 200px;
  }
  .chart-box { border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  canvas { max-height: 420px; }
  .empty-note { color: var(--text-muted); font-size: 13px; padding: 20px 0; }

  table.rank-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rank-table th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  table.rank-table td { padding: 10px; border-bottom: 1px solid #f0f1f3; vertical-align: middle; }
  table.rank-table tr:hover td { background: #fafbfc; }
  .rank-num { font-weight: 700; color: var(--text-muted); width: 28px; display: inline-block; }
  .rank-num.gold { color: #b8860b; }
  .rank-num.silver { color: #8a8a8a; }
  .rank-num.bronze { color: #a05a2c; }
  .player-link { cursor: pointer; font-weight: 600; }
  .player-link:hover { color: var(--accent); }
  .rank-value { font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Shadowverse Premier Series 26-27 選手データトラッカー</h1>
  <nav id="mainNav">
    <button data-view="players">選手一覧</button>
    <button data-view="ranking">ランキング</button>
  </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script>
const DATA_URL = "data/history.csv";
const PLAYERS_URL = "data/players.csv";

const TEAM_COLORS = {
  CR: "#e11d48", ZETA: "#7c3aed", DFM: "#f97316", VRL: "#eab308",
  MRG: "#10b981", RC: "#be123c", RDL: "#6366f1", LVH: "#0891b2",
};
const SERIES_COLORS = ["#2f6fed","#e11d48","#10b981","#f59e0b","#7c3aed","#0891b2","#be123c","#eab308"];

const METRIC_LABELS = {
  followers: "Xフォロワー数",
  youtube_subscribers: "YouTube登録者数",
  stream_duration: "配信時間 (h)",
  watch_time: "視聴時間 (h)",
  video_view_count: "動画再生回数",
  video_upload_count: "動画本数",
  ps_win: "PS公式戦 勝敗",
  ps_point: "PS公式戦 獲得ポイント",
  cr_best_rank_overall: "ランクマッチ最高順位（全クラス）",
  cr_top100_count: "ランクマッチ TOP100入り回数",
};
function metricLabel(m) {
  if (METRIC_LABELS[m]) return METRIC_LABELS[m];
  let mm = m.match(/^cr_rank_(.+)$/);
  if (mm) return `ランクマッチ順位（${mm[1]}）`;
  mm = m.match(/^cr_rating_(.+)$/);
  if (mm) return `ランクマッチレート（${mm[1]}）`;
  return m;
}
function isLowerBetter(m) { return /rank/.test(m); }
function fmtNum(v) {
  const n = Number(v);
  if (Number.isNaN(n)) return v;
  return n.toLocaleString("ja-JP");
}

function parseCSV(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter(l => l.length > 0);
  const headers = lines[0].split(",");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    const row = {};
    headers.forEach((h, i) => row[h] = cols[i]);
    return row;
  });
}

let history = [];
let players = [];
let chart = null;

async function boot() {
  let histText, playersText;
  try {
    [histText, playersText] = await Promise.all([
      fetch(DATA_URL).then(r => r.ok ? r.text() : Promise.reject(new Error(`history.csv fetch failed: ${r.status}`))),
      fetch(PLAYERS_URL).then(r => r.ok ? r.text() : Promise.reject(new Error(`players.csv fetch failed: ${r.status}`))),
    ]);
  } catch (err) {
    document.getElementById("app").innerHTML =
      `<div class="error-banner">データ読み込みエラー: ${err.message}（まだ一度もデータ更新が走っていない可能性があります）</div>`;
    return;
  }

  history = parseCSV(histText);
  players = parseCSV(playersText);

  document.getElementById("mainNav").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-view]");
    if (!btn) return;
    location.hash = `#/${btn.dataset.view}`;
  });

  window.addEventListener("hashchange", render);
  if (!location.hash) location.hash = "#/players";
  render();
}

function currentRoute() {
  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean);
  if (parts[0] === "player" && parts[1]) return { view: "player", name: decodeURIComponent(parts[1]) };
  if (parts[0] === "ranking") return { view: "ranking" };
  return { view: "players" };
}

function latestValue(playerName, metric) {
  const rows = history.filter(r => r.player_name === playerName && r.metric === metric);
  if (!rows.length) return null;
  rows.sort((a, b) => a.date < b.date ? 1 : -1);
  return rows[0].value;
}

function render() {
  const route = currentRoute();
  document.querySelectorAll("#mainNav button").forEach(b => {
    b.classList.toggle("active", (route.view === "players" && b.dataset.view === "players") || (route.view === "ranking" && b.dataset.view === "ranking"));
  });

  if (chart) { chart.destroy(); chart = null; }

  if (route.view === "player") renderPlayerDetail(route.name);
  else if (route.view === "ranking") renderRanking();
  else renderPlayersList();
}

function renderPlayersList() {
  const app = document.getElementById("app");
  const cards = players.map(p => {
    const followers = latestValue(p.player_name, "followers");
    const yt = latestValue(p.player_name, "youtube_subscribers");
    const color = TEAM_COLORS[p.team_tag] || "#888";
    return `
      <div class="player-card" data-name="${encodeURIComponent(p.player_name)}">
        <span class="team-badge" style="background:${color}">${p.team_tag}</span>
        <div class="name">${p.player_name}</div>
        <div class="team-name">${p.team_name}</div>
        <div class="stats">
          <div>Xフォロワー: <b>${followers != null ? fmtNum(followers) : "-"}</b></div>
          <div>YouTube登録者: <b>${yt != null ? fmtNum(yt) : "-"}</b></div>
        </div>
      </div>`;
  }).join("");

  app.innerHTML = `<div class="players-grid">${cards}</div>`;
  app.querySelectorAll(".player-card").forEach(card => {
    card.addEventListener("click", () => { location.hash = `#/player/${card.dataset.name}`; });
  });
}

function renderPlayerDetail(name) {
  const app = document.getElementById("app");
  const player = players.find(p => p.player_name === name);
  const rows = history.filter(r => r.player_name === name);

  if (!player) {
    app.innerHTML = `<div class="back-link" id="backLink">← 選手一覧に戻る</div><div class="empty-note">選手が見つかりません</div>`;
    document.getElementById("backLink").addEventListener("click", () => location.hash = "#/players");
    return;
  }

  const metrics = [...new Set(rows.map(r => r.metric))];
  const preferredOrder = ["followers", "youtube_subscribers"];
  metrics.sort((a, b) => {
    const ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b);
  });

  const followers = latestValue(name, "followers");
  const yt = latestValue(name, "youtube_subscribers");
  const color = TEAM_COLORS[player.team_tag] || "#888";

  app.innerHTML = `
    <div class="back-link" id="backLink">← 選手一覧に戻る</div>
    <div class="detail-header">
      <span class="team-badge" style="background:${color}">${player.team_tag}</span>
      <h2>${player.player_name}</h2>
      <span style="color:var(--text-muted); font-size:13px;">${player.team_name}</span>
    </div>
    <div class="quick-stats">
      <div class="quick-stat"><div class="label">Xフォロワー数</div><div class="value">${followers != null ? fmtNum(followers) : "-"}</div></div>
      <div class="quick-stat"><div class="label">YouTube登録者数</div><div class="value">${yt != null ? fmtNum(yt) : "-"}</div></div>
    </div>
    ${metrics.length ? `
      <div class="control-row">
        <div class="control-group">
          <label>指標</label>
          <select id="metricSelect">${metrics.map(m => `<option value="${m}">${metricLabel(m)}</option>`).join("")}</select>
        </div>
      </div>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    ` : `<div class="empty-note">この選手のデータはまだありません</div>`}
  `;

  document.getElementById("backLink").addEventListener("click", () => location.hash = "#/players");
  if (metrics.length) {
    const sel = document.getElementById("metricSelect");
    sel.addEventListener("change", () => drawPlayerChart(name, sel.value, color));
    drawPlayerChart(name, sel.value, color);
  }
}

function drawPlayerChart(name, metric, color) {
  const rows = history.filter(r => r.player_name === name && r.metric === metric).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const labels = rows.map(r => r.date);
  const data = rows.map(r => parseFloat(r.value));

  if (chart) chart.destroy();
  if (typeof Chart === "undefined") {
    document.querySelector(".chart-box").innerHTML = `<div class="empty-note">グラフライブラリの読み込みに失敗しました</div>`;
    return;
  }
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels, datasets: [{
      label: metricLabel(metric),
      data,
      borderColor: color,
      backgroundColor: color,
      spanGaps: true,
      tension: 0.25,
      pointRadius: 3,
    }] },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#6b7280" }, grid: { color: "#f0f1f3" } },
        y: { ticks: { color: "#6b7280" }, grid: { color: "#f0f1f3" }, reverse: isLowerBetter(metric) },
      },
    },
  });
}

function renderRanking() {
  const app = document.getElementById("app");
  const allMetrics = [...new Set(history.map(r => r.metric))].sort((a, b) => {
    const pref = ["followers", "youtube_subscribers"];
    const ia = pref.indexOf(a), ib = pref.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b);
  });

  app.innerHTML = `
    <div class="control-row">
      <div class="control-group">
        <label>指標</label>
        <select id="rankMetricSelect">${allMetrics.map(m => `<option value="${m}">${metricLabel(m)}</option>`).join("")}</select>
      </div>
      <div class="control-group">
        <label>期間</label>
        <select id="rankPeriodSelect"></select>
      </div>
    </div>
    <div id="rankTableWrap"></div>
  `;

  const metricSelect = document.getElementById("rankMetricSelect");
  const periodSelect = document.getElementById("rankPeriodSelect");

  function refreshPeriods() {
    const metric = metricSelect.value;
    const periods = [...new Set(history.filter(r => r.metric === metric).map(r => r.period))];
    periods.sort();
    periodSelect.innerHTML = periods.map(p => `<option value="${p}">${p}</option>`).join("");
    if (periods.length) periodSelect.value = periods[periods.length - 1];
  }

  function drawTable() {
    const metric = metricSelect.value;
    const period = periodSelect.value;
    const rows = history.filter(r => r.metric === metric && r.period === period);
    const lowerBetter = isLowerBetter(metric);
    rows.sort((a, b) => {
      const va = parseFloat(a.value), vb = parseFloat(b.value);
      return lowerBetter ? va - vb : vb - va;
    });

    if (!rows.length) {
      document.getElementById("rankTableWrap").innerHTML = `<div class="empty-note">この指標・期間のデータはありません</div>`;
      return;
    }

    const medal = ["gold", "silver", "bronze"];
    const body = rows.map((r, i) => {
      const color = TEAM_COLORS[r.team_tag] || "#888";
      const rankClass = medal[i] || "";
      return `
        <tr>
          <td><span class="rank-num ${rankClass}">${i + 1}</span></td>
          <td><span class="team-badge" style="background:${color}">${r.team_tag}</span></td>
          <td><span class="player-link" data-name="${encodeURIComponent(r.player_name)}">${r.player_name}</span></td>
          <td class="rank-value">${fmtNum(r.value)}</td>
        </tr>`;
    }).join("");

    document.getElementById("rankTableWrap").innerHTML = `
      <table class="rank-table">
        <thead><tr><th>#</th><th>チーム</th><th>選手</th><th>${metricLabel(metric)}</th></tr></thead>
        <tbody>${body}</tbody>
      </table>`;

    document.querySelectorAll(".player-link").forEach(el => {
      el.addEventListener("click", () => { location.hash = `#/player/${el.dataset.name}`; });
    });
  }

  metricSelect.addEventListener("change", () => { refreshPeriods(); drawTable(); });
  periodSelect.addEventListener("change", drawTable);

  refreshPeriods();
  drawTable();
}

boot();
</script>
</body>
</html>
