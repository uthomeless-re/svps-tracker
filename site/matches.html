<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試合結果 | Shadowverse Premier Series 26-27 選手データトラッカー</title>
<link rel="stylesheet" href="style.css">
<style>
  .match-row { display: flex; align-items: center; gap: 8px; }
  .result-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .result-badge.win { background: #e6f7ee; color: #0a7a3d; }
  .result-badge.lose { background: #fdeaea; color: #b3261e; }
  /* tdに直接display:flexを当てるとtable-cellのレイアウトが崩れて行がバラバラになる
     不具合があったため、td内側のspanにflexを当てる形にしている */
  .vs-cell { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データトラッカー</a></h1>
  <nav>
    <a class="nav-btn" href="index.html">選手一覧</a>
    <a class="nav-btn" href="ranking.html">ランキング</a>
    <a class="nav-btn active" href="matches.html">試合結果</a>
    <a class="nav-btn" href="compare.html">比較</a>
  </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script src="common.js"></script>
<script>
async function boot() {
  const app = document.getElementById("app");
  const name = new URLSearchParams(location.search).get("name");

  let data, matches;
  try {
    [data, matches] = await Promise.all([loadData(), loadMatches()]);
  } catch (err) {
    app.innerHTML = `<div class="error-banner">データ読み込みエラー: ${err.message}</div>`;
    return;
  }
  const { players, images } = data;

  if (!matches.length) {
    app.innerHTML = `<div class="empty-note">まだ試合結果のデータがありません（PS公式戦の消化済み試合が対象です）</div>`;
    return;
  }

  if (name) {
    renderPlayerMatches(app, players, images, matches, name);
  } else {
    renderLeaderboard(app, players, images, matches);
  }
}

function renderLeaderboard(app, players, images, matches) {
  const all = players.map(p => ({ player: p, stats: summarizeMatches(matches, p.player_name) }));
  const played = all.filter(r => r.stats.played > 0)
    .sort((a, b) => b.stats.points - a.stats.points || b.stats.winRate - a.stats.winRate);
  const unplayed = all.filter(r => r.stats.played === 0);
  const rows = played.concat(unplayed);

  const medal = ["gold", "silver", "bronze"];
  const body = rows.map((r, i) => {
    const { player, stats } = r;
    const isPlayed = stats.played > 0;
    const rankClass = isPlayed ? (medal[i] || "") : "";
    return `
      <tr>
        <td><span class="rank-num ${rankClass}">${isPlayed ? i + 1 : "-"}</span></td>
        <td>${teamLogoHTML(player.team_tag, 22)}</td>
        <td>
          <a class="player-link" href="matches.html?name=${encodeURIComponent(player.player_name)}">
            ${avatarHTML(player, images, 28)}
            ${player.player_name}
          </a>
        </td>
        <td>${stats.wins}勝${stats.losses}敗</td>
        <td>${isPlayed ? (stats.winRate * 100).toFixed(0) + "%" : "-"}</td>
        <td class="rank-value">${isPlayed ? fmtNum(stats.points) : "-"}</td>
      </tr>`;
  }).join("");

  app.innerHTML = `
    <div class="empty-note" style="padding-top:0;">PS公式戦の通算成績（全試合の累計）。選手名をクリックすると個別の試合履歴を見られます。</div>
    <table class="rank-table">
      <thead><tr><th>#</th><th>チーム</th><th>選手</th><th>戦績</th><th>勝率</th><th>獲得ポイント</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

function renderPlayerMatches(app, players, images, matches, name) {
  const player = players.find(p => p.player_name === name);
  if (!player) {
    app.innerHTML = `<a class="back-link" href="matches.html">← 通算成績に戻る</a><div class="empty-note">選手が見つかりません</div>`;
    return;
  }

  const rows = matches.filter(m => m.player_name === name).slice().sort((a, b) => a.round < b.round ? -1 : 1);
  const stats = summarizeMatches(matches, name);

  const body = rows.map(r => `
    <tr>
      <td>${r.round}</td>
      <td><span class="vs-cell">${classIconHTML(r.class)}</span></td>
      <td>
        <span class="vs-cell">
          ${teamLogoHTML(r.opponent_team_tag, 18)}
          <a href="player.html?name=${encodeURIComponent(r.opponent_name)}">${r.opponent_name || "-"}</a>
          ${classIconHTML(r.opponent_class)}
        </span>
      </td>
      <td><span class="result-badge ${r.result === 'WIN' ? 'win' : 'lose'}">${r.result === 'WIN' ? '勝ち' : '負け'}</span></td>
    </tr>`).join("");

  app.innerHTML = `
    <a class="back-link" href="matches.html">← 通算成績に戻る</a>
    <div class="detail-header">
      ${avatarHTML(player, images, 56)}
      <div class="info">
        <h2 style="font-size:20px;">${player.player_name}</h2>
        ${teamLogoHTML(player.team_tag, 24)}
      </div>
    </div>
    <div class="quick-stats">
      <div class="quick-stat"><div class="label">戦績</div><div class="value">${stats.wins}勝${stats.losses}敗</div></div>
      <div class="quick-stat"><div class="label">勝率</div><div class="value">${stats.played ? (stats.winRate * 100).toFixed(0) + "%" : "-"}</div></div>
      <div class="quick-stat"><div class="label">獲得ポイント</div><div class="value">${fmtNum(stats.points)}</div></div>
    </div>
    <table class="rank-table">
      <thead><tr><th>日時</th><th>使用クラス</th><th>対戦相手</th><th>結果</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

boot();
</script>
</body>
</html>
