<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEYOND | Shadowverse Premier Series 26-27 選手データ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データ</a></h1>
  <nav>
    <a class="nav-btn" href="index.html">選手一覧</a>
    <a class="nav-btn" href="ranking.html">ランキング</a>
    <a class="nav-btn" href="rounds.html">対戦成績</a>
    <a class="nav-btn" href="compare.html">比較</a>
    <a class="nav-btn active" href="beyond.html">BEYOND</a>
  </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script src="common.js"></script>
<script>
// svlabo.jpから一括取得したランクマッチ(Worlds Beyond)の全ユーザーリーダーボード
// （data/svlabo_leaderboards.csv）を閲覧するページ。PS出場選手・アマチュアを区別せず、
// 掲載されている全ユーザーを対象にする。
// 指標は「レート」（svlabo本家と同じ期間×クラスの順位。クラスは「すべて」を選べば
// 全クラス合算の最高レートTOP100になる）に加えて、ranking.htmlと同じ指標
// （Xフォロワー数・YouTube登録者数・配信時間・動画本数・動画再生回数・配信視聴時間・
// 累積配信時間・CR順位TOP N入り回数）も選べる。ranking.htmlはPS出場選手37人限定だが、
// ここではsvlaboに載っている全ユーザーを対象にする（PS選手以外は該当データが無い指標だと
// 「-」になる。CR順位TOP N入り回数だけは全ユーザー分に実データがある）。
// 選手検索を使っている間は、指標・期間・クラスの絞り込みを無視して全期間×全クラスを
// 横断的に検索する（特定の選手を探したいだけなのに期間とクラスを両方合わせないと
// 見つからないのは不便なため）。
let svlabo = [], playerLookup = {}, history = [];
const HISTORY_CURRENT_METRICS = ["followers", "youtube_subscribers"];
const HISTORY_PERIODIC_METRICS = ["stream_duration", "video_view_count", "video_upload_count", "watch_time"];
const filters = { metric: "rating", period: null, class: "", historyPeriod: null, threshold: 100, team: "", query: "" };

function playerNameCellHTML(rawName) {
  const p = lookupPlayer(playerLookup, rawName);
  if (p) return `<a class="player-link" href="player.html?name=${encodeURIComponent(p.player_name)}">${rawName}</a>`;
  return rawName;
}

// チームに所属していないのはこの一覧では普通のこと（PS選手の方が少数派）なので、
// 「無所属」と目立つ文言を出さず、単に薄いダッシュにする。
function teamCellHTML(rawTag) {
  const tag = resolveTeamTag(rawTag);
  if (!tag) return `<span style="color:var(--text-muted);">-</span>`;
  return teamLogoHTML(tag, 20);
}

function teamOptionsHTML(teams) {
  return `<option value="">すべて</option>${teams.map(t => `<option value="${t}">${t}</option>`).join("")}<option value="__none__">無所属のみ</option>`;
}

// svlabo全体を通して選手を1人1行に重複除去した一覧（名前を正規化して同一人物とみなす）。
// ファイル内の出現順は新しい期間が先頭なので、最初に見つかった行＝直近の所属チームを採用する。
function uniqueSvlaboPlayers(list) {
  const seen = new Set();
  const out = [];
  list.forEach(r => {
    const key = normalizeName(r.player_name);
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ team_tag: r.team_tag, player_name: r.player_name });
  });
  return out;
}

function applyTeamAndSearch(rows, team, query) {
  let out = rows;
  if (team === "__none__") out = out.filter(r => !r.team_tag);
  else if (team) out = out.filter(r => resolveTeamTag(r.team_tag) === team);
  if (query.trim()) {
    const q = normalizeName(query);
    out = out.filter(r => normalizeName(r.player_name).includes(q));
  }
  return out;
}

// 選手検索モード: 期間・クラス・指標の絞り込みを無視して、名前が一致する行を
// 全期間×全クラス横断でそのまま列挙する（svlaboの生データをそのまま見せる）。
function renderSearchResults(container, teams) {
  let rows = svlabo.slice();
  if (filters.team === "__none__") rows = rows.filter(r => !r.team_tag);
  else if (filters.team) rows = rows.filter(r => resolveTeamTag(r.team_tag) === filters.team);
  const q = normalizeName(filters.query);
  rows = rows.filter(r => normalizeName(r.player_name).includes(q));

  const body = rows.map(r => `
    <tr>
      <td>${escapeAttr(r.period)}</td>
      <td>${classIconHTML(r.class, 20)}</td>
      <td class="rank-value">${r.rank}位</td>
      <td>${teamCellHTML(r.team_tag)}</td>
      <td>${playerNameCellHTML(r.player_name)}</td>
      <td class="rank-value">${fmtNum(r.rating)}</td>
    </tr>`).join("");

  container.innerHTML = rows.length ? `
    <table class="rank-table">
      <thead><tr><th>期間</th><th>クラス</th><th>順位</th><th>チーム</th><th>選手</th><th>レート</th></tr></thead>
      <tbody>${body}</tbody>
    </table>` : `<div class="empty-note">該当する選手がいません</div>`;
}

function renderBoard(app, svlaboPeriods, classes, teams) {
  const availableHistoryMetrics = new Set(history.map(r => r.metric));
  const currentOpts = HISTORY_CURRENT_METRICS.filter(m => availableHistoryMetrics.has(m));
  const periodicOpts = HISTORY_PERIODIC_METRICS.filter(m => availableHistoryMetrics.has(m));
  const hasCumulative = availableHistoryMetrics.has("stream_duration");

  app.innerHTML = `
    <div class="control-row">
      <div class="control-group">
        <label>指標</label>
        <select id="metricSelect">
          <optgroup label="Worlds Beyond">
            <option value="rating">レート</option>
          </optgroup>
          ${currentOpts.length ? `<optgroup label="現在値">${currentOpts.map(m => `<option value="${m}">${metricLabel(m)}</option>`).join("")}</optgroup>` : ""}
          ${periodicOpts.length ? `<optgroup label="期間ごとの指標">${periodicOpts.map(m => `<option value="${m}">${metricLabel(m)}</option>`).join("")}</optgroup>` : ""}
          ${hasCumulative ? `<optgroup label="通算"><option value="stream_duration_cumulative">${metricLabel("stream_duration_cumulative")}</option></optgroup>` : ""}
          <optgroup label="ランクマッチ(CR)"><option value="cr_topN_count">CR順位 TOP N入り回数</option></optgroup>
        </select>
      </div>
      <div class="control-group" id="periodGroup">
        <label>期間</label>
        <select id="periodSelect"></select>
      </div>
      <div class="control-group" id="classGroup">
        <label>クラス</label>
        <select id="classSelect">
          <option value="">すべて</option>
          ${classes.map(c => `<option value="${escapeAttr(c)}">${c}</option>`).join("")}
        </select>
      </div>
      <div class="control-group" id="thresholdGroup" style="display:none;">
        <label>しきい値</label>
        <select id="thresholdSelect">${CR_TOPN_THRESHOLDS.map(t => `<option value="${t}">TOP${t}以内</option>`).join("")}</select>
      </div>
      <div class="control-group">
        <label>チーム</label>
        <select id="teamSelect">${teamOptionsHTML(teams)}</select>
      </div>
      <div class="control-group">
        <label>選手検索</label>
        <input type="text" id="querySelect" placeholder="選手名で検索（全期間・全クラスを横断）">
      </div>
    </div>
    <div id="tableWrap"></div>
  `;

  const metricSelect = document.getElementById("metricSelect");
  const periodGroup = document.getElementById("periodGroup");
  const periodSelect = document.getElementById("periodSelect");
  const classGroup = document.getElementById("classGroup");
  const classSelect = document.getElementById("classSelect");
  const thresholdGroup = document.getElementById("thresholdGroup");
  const thresholdSelect = document.getElementById("thresholdSelect");
  const teamSelect = document.getElementById("teamSelect");
  const querySelect = document.getElementById("querySelect");

  metricSelect.value = filters.metric;
  teamSelect.value = filters.team;
  querySelect.value = filters.query;
  thresholdSelect.value = filters.threshold;

  const isRating = () => metricSelect.value === "rating";
  const isCr = () => metricSelect.value === "cr_topN_count";
  const isPeriodicHistory = () => periodicOpts.includes(metricSelect.value);
  const isCumulative = () => metricSelect.value === "stream_duration_cumulative";
  const isCurrentHistory = () => currentOpts.includes(metricSelect.value);

  function refreshControlVisibility() {
    const searching = filters.query.trim() !== "";
    periodGroup.style.display = (!searching && (isRating() || isPeriodicHistory())) ? "" : "none";
    classGroup.style.display = (!searching && isRating()) ? "" : "none";
    thresholdGroup.style.display = (!searching && isCr()) ? "" : "none";

    if (isRating()) {
      periodSelect.innerHTML = svlaboPeriods.map(p => `<option value="${escapeAttr(p)}">${p}</option>`).join("");
      periodSelect.value = filters.period || svlaboPeriods[0];
    } else if (isPeriodicHistory()) {
      const periods = [...new Set(history.filter(r => r.metric === metricSelect.value).map(r => r.period))];
      periods.sort((a, b) => periodSortKey(a) - periodSortKey(b));
      periodSelect.innerHTML = periods.map(p => `<option value="${p}">${periodLabel(p)}</option>`).join("");
      if (periods.includes("regular_season")) periodSelect.value = "regular_season";
      else if (periods.length) periodSelect.value = periods[periods.length - 1];
    }
  }

  function draw() {
    filters.metric = metricSelect.value;
    filters.team = teamSelect.value;
    filters.query = querySelect.value;
    if (isRating()) { filters.period = periodSelect.value; filters.class = classSelect.value; }
    if (isPeriodicHistory()) filters.historyPeriod = periodSelect.value;
    if (isCr()) filters.threshold = parseInt(thresholdSelect.value, 10);

    const tableWrap = document.getElementById("tableWrap");

    // 検索中は指標・期間・クラスを無視して全期間×全クラス横断で検索結果を出す
    if (filters.query.trim()) {
      renderSearchResults(tableWrap, teams);
      return;
    }

    let headerLabel, rows, isAllClasses = false;

    if (isRating()) {
      isAllClasses = filters.class === "";
      if (isAllClasses) {
        const byPlayer = {};
        svlabo.filter(r => r.period === filters.period).forEach(r => {
          const key = r.team_tag + "|" + r.player_name;
          const rating = parseFloat(r.rating) || 0;
          if (!byPlayer[key] || rating > byPlayer[key].rating) {
            byPlayer[key] = { team_tag: r.team_tag, player_name: r.player_name, rating, best_class: r.class };
          }
        });
        rows = Object.values(byPlayer);
      } else {
        rows = svlabo.filter(r => r.period === filters.period && r.class === filters.class)
          .map(r => ({ team_tag: r.team_tag, player_name: r.player_name, rating: parseFloat(r.rating) || 0, rank: parseInt(r.rank, 10) }));
      }
      rows = applyTeamAndSearch(rows, filters.team, "");
      if (isAllClasses) {
        rows.sort((a, b) => b.rating - a.rating);
        rows = rows.slice(0, 100);
        assignCompetitionRanks(rows, r => r.rating);
      } else {
        rows.sort((a, b) => a.rank - b.rank);
      }
      headerLabel = "レート";
    } else {
      const population = applyTeamAndSearch(uniqueSvlaboPlayers(svlabo), filters.team, "");
      headerLabel = isCr() ? crTopNLabel(filters.threshold) : metricLabel(metricSelect.value);

      if (isCr()) {
        const counts = crTopNCounts(svlabo, filters.threshold);
        rows = population.map(u => ({ team_tag: u.team_tag, player_name: u.player_name, rating: counts[normalizeName(u.player_name)] || 0 }));
      } else {
        rows = population.map(u => {
          const matched = lookupPlayer(playerLookup, u.player_name);
          let value = null;
          if (matched) {
            if (isCurrentHistory()) value = latestValue(history, matched.player_name, metricSelect.value);
            else if (isCumulative()) {
              const series = buildCumulativeSeries(history, matched.player_name, "stream_duration");
              value = series.data.length ? series.data[series.data.length - 1] : null;
            } else if (isPeriodicHistory()) {
              const row = history.find(r => r.player_name === matched.player_name && r.metric === metricSelect.value && r.period === filters.historyPeriod);
              value = row ? row.value : null;
            }
          }
          return { team_tag: u.team_tag, player_name: u.player_name, rating: (value != null && value !== "") ? parseFloat(value) : null };
        });
      }

      const withValue = rows.filter(r => r.rating != null);
      const withoutValue = rows.filter(r => r.rating == null);
      withValue.sort((a, b) => b.rating - a.rating);
      assignCompetitionRanks(withValue, r => r.rating);
      withoutValue.forEach(r => { r.rank = null; });
      rows = [...withValue, ...withoutValue];
    }

    const body = rows.map(r => `
      <tr>
        <td class="rank-value">${r.rank != null ? r.rank + "位" : "-"}</td>
        <td>${teamCellHTML(r.team_tag)}</td>
        <td>${playerNameCellHTML(r.player_name)}</td>
        ${isAllClasses ? `<td>${classIconHTML(r.best_class, 20)}</td>` : ""}
        <td class="rank-value">${r.rating != null ? fmtNum(r.rating) : "-"}</td>
      </tr>`).join("");

    tableWrap.innerHTML = rows.length ? `
      <table class="rank-table">
        <thead><tr><th>順位</th><th>チーム</th><th>選手</th>${isAllClasses ? "<th>最高クラス</th>" : ""}<th>${headerLabel}</th></tr></thead>
        <tbody>${body}</tbody>
      </table>` : `<div class="empty-note">該当する選手がいません</div>`;
  }

  metricSelect.addEventListener("change", () => { refreshControlVisibility(); draw(); });
  periodSelect.addEventListener("change", draw);
  classSelect.addEventListener("change", draw);
  thresholdSelect.addEventListener("change", draw);
  teamSelect.addEventListener("change", draw);
  querySelect.addEventListener("input", () => { refreshControlVisibility(); draw(); });

  refreshControlVisibility();
  draw();
}

async function boot() {
  const app = document.getElementById("app");
  let data;
  try {
    [data, svlabo] = await Promise.all([loadData(), loadSvlaboLeaderboard()]);
  } catch (err) {
    app.innerHTML = `<div class="error-banner">データ読み込みエラー: ${err.message}</div>`;
    return;
  }
  if (!svlabo.length) {
    app.innerHTML = `<div class="empty-note">まだランクマッチのデータがありません</div>`;
    return;
  }
  playerLookup = buildPlayerLookup(data.players);
  history = data.history;

  // ファイル内での出現順が新しい期間から並んでいるので、そのまま使う（先頭が最新）。
  const periods = [...new Set(svlabo.map(r => r.period))];
  const classes = [...new Set(svlabo.map(r => r.class))];
  const teams = [...new Set(svlabo.map(r => resolveTeamTag(r.team_tag)).filter(Boolean))].sort((a, b) => a.localeCompare(b));

  filters.period = periods[0];
  filters.class = ""; // デフォルトは「すべて」

  renderBoard(app, periods, classes, teams);
}

boot();
</script>
</body>
</html>
